# SPDX-License-Identifier: BSD-2-Clause
#
# The rules of the ckb sandbox. A pattern matches the LAST component of a
# path only, so "ckb.toml" covers every ckb.toml on the host.
#
# Four sandboxes: [sandbox.ckb] for the CKB full node, [sandbox.fnn] for
# the Fiber node, [sandbox.ckb-light] for the CKB light client and
# [sandbox.stratum-proxy] for a Node.js stratum mining proxy. Each has
# its own network choice.
#
# NETWORK: pick ONE of two options per sandbox.
#   Option A (default) - public node: it may connect to any peer. Leave
#     both Option B blocks below commented out.
#   Option B - private node: it may connect ONLY to the networks you
#     list. Uncomment the [networks] table here AND the `network = ...`
#     line under [sandbox.ckb], then put in your own peers. Anything not
#     listed is refused with EACCES, so list every peer you dial out
#     to and keep 127.0.0.0/8 for the local DNS resolver. Inbound
#     connections (peers dialing you, RPC clients) are never restricted.

# --- Option B, part 1 of 2 (shared by both sandboxes) ---
# Uncomment [networks] and `local` for EITHER sandbox's Option B, plus
# the list(s) that sandbox names.
# [networks]
# local = ["127.0.0.0/8", "::1/128"]
# ckb_peers = ["10.0.0.0/8", "192.168.0.0/16", "203.0.113.7/32"]
# fiber_peers = ["10.0.0.0/8", "192.168.0.0/16", "203.0.113.7/32"]
# CKB RPC that fnn reads the chain from. A hostname behind a CDN changes
# IPs, so Option B suits fnn pointed at your OWN CKB node.
# fiber_ckb_rpc = ["192.168.1.10/32"]
# light_peers = ["10.0.0.0/8", "192.168.0.0/16", "203.0.113.7/32"]
# The CKB node(s) the mining proxy reads templates from and submits to
# (RPC + WebSocket ports), and in pool mode the upstream pool's IPs.
# proxy_upstream = ["192.168.1.10/32"]

[sandbox.ckb]
# A CKB node starts no other program, so it may execute nothing beyond
# its own binary. This is the rule that stops "exploit, then shell".
exec = []

# --- Option B, part 2 of 2 --- (Option A: leave this commented out)
# network = ["@local", "@ckb_peers"]

[sandbox.ckb.deny]
# What the node never needs to write while it runs: its own config and
# binaries, shared libraries, and the files an attacker writes to get
# back in after a restart (SSH keys, shell rc files, systemd units,
# cron, the loader preload list, account databases).
create = [
	"ckb.toml", "ckb-miner.toml", "default.db-options",
	"ckb", "ckb-cli", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
rename = [
	"ckb.toml", "ckb-miner.toml", "default.db-options",
	"ckb", "ckb-cli", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
write = [
	"ckb.toml", "ckb-miner.toml", "default.db-options",
	"ckb", "ckb-cli", "*.so", "*.so.?",
	"authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]

[sandbox.fnn]
# A Fiber node starts no other program either.
exec = []

# --- Option B, part 2 of 2 for fnn --- (Option A: leave commented out)
# network = ["@local", "@fiber_peers", "@fiber_ckb_rpc"]

[sandbox.fnn.deny]
# config.yml holds the RPC auth (biscuit_public_key) and every setting
# an attacker would change to keep control; fnn never writes it.
#
# NOT denied: "key" (ckb/key, the funding key) and "sk" (fiber/sk). fnn
# writes files with those names into fiber/backups/<time>/ on EVERY
# start, and a rule matches names, not directories, so denying them
# breaks the node. Protect ckb/key with ownership instead, see README.
create = [
	"config.yml", "fnn", "fnn-cli", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
rename = [
	"config.yml", "fnn", "fnn-cli", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
write = [
	"config.yml", "fnn", "fnn-cli", "*.so", "*.so.?",
	"authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]

[sandbox.ckb-light]
# The light client starts no other program either.
exec = []

# --- Option B, part 2 of 2 for ckb-light --- (Option A: leave commented)
# A light client syncs from full nodes that serve light-client
# protocols; list the ones you run or trust.
# network = ["@local", "@light_peers"]

[sandbox.ckb-light.deny]
# The light client writes no .toml file at all, so "*.toml" protects its
# config whatever it is called (testnet.toml, mainnet.toml, config.toml).
# It holds no wallet keys; data/network/secret_key is only its P2P id.
create = [
	"*.toml", "ckb-light-client", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
rename = [
	"*.toml", "ckb-light-client", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
write = [
	"*.toml", "ckb-light-client", "*.so", "*.so.?",
	"authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]

[sandbox.stratum-proxy]
# The proxy starts no other program.
exec = []

# --- Option B, part 2 of 2 for stratum-proxy --- (Option A: leave
# commented). RECOMMENDED here: a solo proxy dials out ONLY to its CKB
# node, so the allowlist is one line and stops it phoning home. Miners
# connecting IN to port 3333 and the stats page are never restricted.
# network = ["@local", "@proxy_upstream"]

[sandbox.stratum-proxy.deny]
# config.json picks the node the proxy trusts and the payout address it
# shows; *.js/*.mjs/*.cjs/*.node are its code, package*.json its deps;
# *.html its dashboard. It writes only logs/session-*.jsonl.
create = [
	"config.json", "*.js", "*.mjs", "*.cjs", "*.node", "package.json", "package-lock.json",
	"*.html", "node", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
rename = [
	"config.json", "*.js", "*.mjs", "*.cjs", "*.node", "package.json", "package-lock.json",
	"*.html", "node", "*.so", "*.so.?",
	".ssh", "authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab", "cron.*",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
write = [
	"config.json", "*.js", "*.mjs", "*.cjs", "*.node", "package.json", "package-lock.json",
	"*.html", "node", "*.so", "*.so.?",
	"authorized_keys", "authorized_keys2",
	".bashrc", ".bash_profile", ".profile", ".zshrc",
	"*.service", "*.timer", "*.socket", "crontab",
	"ld.so.preload", "sudoers", "passwd", "shadow",
]
